{% extends 'base.html' %}

{% block title %}Sign Up | CampusConnect{% endblock %}

{% block content %}

<div class="container">
    <div class="card">

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Join CampusConnect and connect with your campus community.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Create Account
            </button>
        </form>

        <p class="footer-text">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

    </div>
</div>

{% endblock %}
